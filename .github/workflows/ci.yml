name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck -s bash -S warning bashrc bashrc.d/*.sh bin/store-token install.sh scripts/check-secrets.sh scripts/hooks/pre-commit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: scripts/check-secrets.sh --all

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [shellcheck, secrets]
    if: always()
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
